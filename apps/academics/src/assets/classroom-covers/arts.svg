<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="800" height="200">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#831843"/>
      <stop offset="100%" stop-color="#e11d48"/>
    </linearGradient>
  </defs>
  <rect width="800" height="200" fill="url(#bg)"/>
  <!-- Paint palette -->
  <g transform="translate(500, 95)">
    <ellipse rx="50" ry="40" fill="white" fill-opacity="0.08" stroke="white" stroke-opacity="0.12" stroke-width="1.5"/>
    <circle cx="-20" cy="-15" r="8" fill="white" fill-opacity="0.1"/>
    <circle cx="10" cy="-20" r="7" fill="white" fill-opacity="0.08"/>
    <circle cx="30" cy="-8" r="6" fill="white" fill-opacity="0.06"/>
    <circle cx="25" cy="15" r="7" fill="white" fill-opacity="0.08"/>
    <circle cx="-5" cy="18" r="6" fill="white" fill-opacity="0.06"/>
    <circle cx="-30" cy="5" r="12" fill="none" stroke="white" stroke-opacity="0.1" stroke-width="1"/>
  </g>
  <!-- Paint brush -->
  <g transform="translate(600, 60) rotate(35)" fill="white" fill-opacity="0.1" stroke="none">
    <rect x="-3" y="-40" width="6" height="55" rx="2"/>
    <path d="M-6,15 C-8,25 -4,35 0,40 C4,35 8,25 6,15Z"/>
    <rect x="-5" y="12" width="10" height="8" rx="1" fill-opacity="0.08"/>
  </g>
  <!-- Musical notes -->
  <g transform="translate(680, 55)" fill="white" fill-opacity="0.1" stroke="none">
    <ellipse cx="0" cy="0" rx="7" ry="5" transform="rotate(-20)"/>
    <rect x="6" y="-30" width="2" height="30"/>
    <path d="M8,-30 C15,-35 20,-25 15,-20" fill="white" fill-opacity="0.08"/>
  </g>
  <g transform="translate(720, 75)" fill="white" fill-opacity="0.08" stroke="none">
    <ellipse cx="0" cy="0" rx="6" ry="4" transform="rotate(-20)"/>
    <rect x="5" y="-25" width="2" height="25"/>
  </g>
  <!-- Theater masks -->
  <g transform="translate(400, 60)" fill="none" stroke="white" stroke-opacity="0.1" stroke-width="1.5">
    <!-- Comedy mask -->
    <path d="M-15,-15 C-15,-25 15,-25 15,-15 L15,5 C15,15 -15,15 -15,5Z"/>
    <circle cx="-6" cy="-8" r="3" fill="white" fill-opacity="0.06"/>
    <circle cx="6" cy="-8" r="3" fill="white" fill-opacity="0.06"/>
    <path d="M-7,3 C-3,8 3,8 7,3"/>
  </g>
  <g transform="translate(430, 70)" fill="none" stroke="white" stroke-opacity="0.08" stroke-width="1.5">
    <!-- Tragedy mask -->
    <path d="M-12,-12 C-12,-22 12,-22 12,-12 L12,5 C12,12 -12,12 -12,5Z"/>
    <circle cx="-5" cy="-6" r="2.5" fill="white" fill-opacity="0.05"/>
    <circle cx="5" cy="-6" r="2.5" fill="white" fill-opacity="0.05"/>
    <path d="M-5,5 C-2,1 2,1 5,5"/>
  </g>
  <!-- Color wheel segments -->
  <g transform="translate(740, 140)" fill="none" stroke="white" stroke-opacity="0.08" stroke-width="1">
    <circle r="20"/>
    <line x1="0" y1="-20" x2="0" y2="20"/>
    <line x1="-17" y1="-10" x2="17" y2="10"/>
    <line x1="-17" y1="10" x2="17" y2="-10"/>
  </g>
  <!-- Abstract brush strokes -->
  <path d="M350,160 C380,150 400,155 420,145" fill="none" stroke="white" stroke-opacity="0.06" stroke-width="3" stroke-linecap="round"/>
  <path d="M620,160 C640,155 660,165 690,155" fill="none" stroke="white" stroke-opacity="0.05" stroke-width="4" stroke-linecap="round"/>
  <!-- Scattered dots -->
  <circle cx="370" cy="30" r="3" fill="white" fill-opacity="0.05"/>
  <circle cx="660" cy="40" r="2" fill="white" fill-opacity="0.04"/>
</svg>
