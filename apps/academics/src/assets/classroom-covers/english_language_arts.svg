<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="800" height="200">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#78350f"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
  </defs>
  <rect width="800" height="200" fill="url(#bg)"/>
  <!-- Ruled lines (notebook paper) -->
  <g stroke="white" stroke-opacity="0.06" stroke-width="1">
    <line x1="350" y1="40" x2="780" y2="40"/><line x1="350" y1="60" x2="780" y2="60"/>
    <line x1="350" y1="80" x2="780" y2="80"/><line x1="350" y1="100" x2="780" y2="100"/>
    <line x1="350" y1="120" x2="780" y2="120"/><line x1="350" y1="140" x2="780" y2="140"/>
    <line x1="350" y1="160" x2="780" y2="160"/>
  </g>
  <!-- Open book -->
  <g transform="translate(520, 85)" fill="none" stroke="white" stroke-opacity="0.15" stroke-width="1.5">
    <path d="M0,0 C-10,-35 -70,-40 -80,-35 L-80,35 C-70,30 -10,30 0,5Z"/>
    <path d="M0,0 C10,-35 70,-40 80,-35 L80,35 C70,30 10,30 0,5Z"/>
    <line x1="-65" y1="-20" x2="-15" y2="-20" stroke-opacity="0.08"/>
    <line x1="-65" y1="-10" x2="-15" y2="-10" stroke-opacity="0.08"/>
    <line x1="-65" y1="0" x2="-15" y2="0" stroke-opacity="0.08"/>
    <line x1="15" y1="-20" x2="65" y2="-20" stroke-opacity="0.08"/>
    <line x1="15" y1="-10" x2="65" y2="-10" stroke-opacity="0.08"/>
    <line x1="15" y1="0" x2="65" y2="0" stroke-opacity="0.08"/>
  </g>
  <!-- Quill pen -->
  <g transform="translate(700, 50) rotate(30)" fill="white" fill-opacity="0.12" stroke="none">
    <path d="M0,0 C5,-60 -15,-80 -10,-90 C-5,-80 0,-60 -3,-10 Z"/>
    <rect x="-2" y="0" width="3" height="20" rx="1"/>
  </g>
  <!-- Quotation marks -->
  <text x="380" y="55" font-family="Georgia, serif" font-size="48" fill="white" fill-opacity="0.1">"</text>
  <text x="740" y="155" font-family="Georgia, serif" font-size="48" fill="white" fill-opacity="0.1">"</text>
  <!-- Paragraph symbol -->
  <text x="650" y="65" font-family="serif" font-size="28" fill="white" fill-opacity="0.08">¶</text>
  <!-- Ink drop -->
  <circle cx="710" cy="135" r="8" fill="white" fill-opacity="0.08"/>
  <circle cx="715" cy="142" r="4" fill="white" fill-opacity="0.06"/>
  <!-- Small decorative dots -->
  <circle cx="400" cy="170" r="3" fill="white" fill-opacity="0.06"/>
  <circle cx="450" cy="30" r="2" fill="white" fill-opacity="0.05"/>
</svg>
