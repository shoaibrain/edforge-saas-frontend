<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="800" height="200">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#431407"/>
      <stop offset="100%" stop-color="#c2410c"/>
    </linearGradient>
  </defs>
  <rect width="800" height="200" fill="url(#bg)"/>
  <!-- Crossed wrench + hammer -->
  <g transform="translate(520, 90)" fill="white" fill-opacity="0.12" stroke="none">
    <!-- Wrench -->
    <g transform="rotate(-30)">
      <rect x="-3" y="-45" width="6" height="60" rx="2"/>
      <path d="M-10,-45 C-10,-55 10,-55 10,-45 L8,-38 L-8,-38Z"/>
      <rect x="-2" y="-38" width="4" height="8"/>
    </g>
    <!-- Hammer -->
    <g transform="rotate(30)">
      <rect x="-3" y="-45" width="6" height="65" rx="2"/>
      <rect x="-14" y="-52" width="28" height="14" rx="3"/>
    </g>
  </g>
  <!-- Gear cog 1 -->
  <g transform="translate(660, 70)" fill="none" stroke="white" stroke-opacity="0.1" stroke-width="1.5">
    <circle r="22"/>
    <circle r="12"/>
    <circle r="5" fill="white" fill-opacity="0.06"/>
    <!-- Teeth -->
    <rect x="-4" y="-28" width="8" height="8" rx="1" fill="white" fill-opacity="0.06" transform="rotate(0 0 0)"/>
    <rect x="-4" y="-28" width="8" height="8" rx="1" fill="white" fill-opacity="0.06" transform="rotate(45 0 0)"/>
    <rect x="-4" y="-28" width="8" height="8" rx="1" fill="white" fill-opacity="0.06" transform="rotate(90 0 0)"/>
    <rect x="-4" y="-28" width="8" height="8" rx="1" fill="white" fill-opacity="0.06" transform="rotate(135 0 0)"/>
    <rect x="-4" y="-28" width="8" height="8" rx="1" fill="white" fill-opacity="0.06" transform="rotate(180 0 0)"/>
    <rect x="-4" y="-28" width="8" height="8" rx="1" fill="white" fill-opacity="0.06" transform="rotate(225 0 0)"/>
    <rect x="-4" y="-28" width="8" height="8" rx="1" fill="white" fill-opacity="0.06" transform="rotate(270 0 0)"/>
    <rect x="-4" y="-28" width="8" height="8" rx="1" fill="white" fill-opacity="0.06" transform="rotate(315 0 0)"/>
  </g>
  <!-- Gear cog 2 (smaller, interlocked) -->
  <g transform="translate(700, 110)" fill="none" stroke="white" stroke-opacity="0.08" stroke-width="1">
    <circle r="15"/>
    <circle r="8"/>
    <circle r="3" fill="white" fill-opacity="0.05"/>
    <rect x="-3" y="-20" width="6" height="6" rx="1" fill="white" fill-opacity="0.04" transform="rotate(22 0 0)"/>
    <rect x="-3" y="-20" width="6" height="6" rx="1" fill="white" fill-opacity="0.04" transform="rotate(82 0 0)"/>
    <rect x="-3" y="-20" width="6" height="6" rx="1" fill="white" fill-opacity="0.04" transform="rotate(142 0 0)"/>
    <rect x="-3" y="-20" width="6" height="6" rx="1" fill="white" fill-opacity="0.04" transform="rotate(202 0 0)"/>
    <rect x="-3" y="-20" width="6" height="6" rx="1" fill="white" fill-opacity="0.04" transform="rotate(262 0 0)"/>
    <rect x="-3" y="-20" width="6" height="6" rx="1" fill="white" fill-opacity="0.04" transform="rotate(322 0 0)"/>
  </g>
  <!-- Hardhat -->
  <g transform="translate(420, 55)" fill="white" fill-opacity="0.08" stroke="none">
    <path d="M-22,5 L22,5 L22,0 C22,-18 -22,-18 -22,0Z"/>
    <rect x="-28" y="5" width="56" height="5" rx="2"/>
  </g>
  <!-- Welding sparks -->
  <g fill="white" fill-opacity="0.08" stroke="none">
    <circle cx="580" cy="40" r="2"/><circle cx="590" cy="35" r="1.5"/>
    <circle cx="575" cy="32" r="1"/><circle cx="595" cy="42" r="1.5"/>
    <circle cx="585" cy="28" r="1"/>
  </g>
  <!-- Saw blade -->
  <g transform="translate(760, 150)" fill="none" stroke="white" stroke-opacity="0.07" stroke-width="1.5">
    <circle r="18"/>
    <circle r="4" fill="white" fill-opacity="0.05"/>
    <path d="M0,-18 L3,-14 L-3,-14Z" fill="white" fill-opacity="0.04"/>
    <path d="M0,-18 L3,-14 L-3,-14Z" fill="white" fill-opacity="0.04" transform="rotate(30 0 0)"/>
    <path d="M0,-18 L3,-14 L-3,-14Z" fill="white" fill-opacity="0.04" transform="rotate(60 0 0)"/>
    <path d="M0,-18 L3,-14 L-3,-14Z" fill="white" fill-opacity="0.04" transform="rotate(90 0 0)"/>
    <path d="M0,-18 L3,-14 L-3,-14Z" fill="white" fill-opacity="0.04" transform="rotate(120 0 0)"/>
    <path d="M0,-18 L3,-14 L-3,-14Z" fill="white" fill-opacity="0.04" transform="rotate(150 0 0)"/>
    <path d="M0,-18 L3,-14 L-3,-14Z" fill="white" fill-opacity="0.04" transform="rotate(180 0 0)"/>
    <path d="M0,-18 L3,-14 L-3,-14Z" fill="white" fill-opacity="0.04" transform="rotate(210 0 0)"/>
    <path d="M0,-18 L3,-14 L-3,-14Z" fill="white" fill-opacity="0.04" transform="rotate(240 0 0)"/>
    <path d="M0,-18 L3,-14 L-3,-14Z" fill="white" fill-opacity="0.04" transform="rotate(270 0 0)"/>
    <path d="M0,-18 L3,-14 L-3,-14Z" fill="white" fill-opacity="0.04" transform="rotate(300 0 0)"/>
    <path d="M0,-18 L3,-14 L-3,-14Z" fill="white" fill-opacity="0.04" transform="rotate(330 0 0)"/>
  </g>
  <!-- Toolbox -->
  <g transform="translate(400, 150)" fill="none" stroke="white" stroke-opacity="0.07" stroke-width="1.5">
    <rect x="-20" y="-10" width="40" height="20" rx="3"/>
    <rect x="-8" y="-14" width="16" height="6" rx="2"/>
    <line x1="-5" y1="-10" x2="-5" y2="10" stroke-opacity="0.04"/>
    <line x1="5" y1="-10" x2="5" y2="10" stroke-opacity="0.04"/>
  </g>
  <!-- Dots -->
  <circle cx="360" cy="40" r="2" fill="white" fill-opacity="0.04"/>
  <circle cx="480" cy="170" r="3" fill="white" fill-opacity="0.05"/>
</svg>
