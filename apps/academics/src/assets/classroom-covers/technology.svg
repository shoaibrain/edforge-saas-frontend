<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="800" height="200">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c4a6e"/>
      <stop offset="100%" stop-color="#0891b2"/>
    </linearGradient>
  </defs>
  <rect width="800" height="200" fill="url(#bg)"/>
  <!-- Circuit board traces -->
  <g stroke="white" stroke-opacity="0.08" stroke-width="1.5" fill="none">
    <path d="M350,30 L400,30 L400,60 L450,60"/>
    <path d="M380,80 L420,80 L420,120 L480,120"/>
    <path d="M500,40 L500,70 L550,70 L550,100"/>
    <path d="M600,30 L600,50 L650,50 L650,90"/>
    <path d="M700,60 L700,100 L740,100"/>
    <path d="M450,150 L500,150 L500,170 L560,170"/>
    <!-- Nodes -->
    <circle cx="450" cy="60" r="3" fill="white" fill-opacity="0.1"/>
    <circle cx="480" cy="120" r="3" fill="white" fill-opacity="0.1"/>
    <circle cx="550" cy="100" r="3" fill="white" fill-opacity="0.1"/>
    <circle cx="650" cy="90" r="3" fill="white" fill-opacity="0.1"/>
    <circle cx="740" cy="100" r="3" fill="white" fill-opacity="0.1"/>
  </g>
  <!-- Code brackets </> -->
  <g transform="translate(550, 60)" fill="none" stroke="white" stroke-opacity="0.15" stroke-width="2" stroke-linecap="round">
    <path d="M-15,-20 L-30,0 L-15,20"/>
    <path d="M15,-20 L30,0 L15,20"/>
    <line x1="-5" y1="-22" x2="5" y2="22"/>
  </g>
  <!-- Binary digits -->
  <g font-family="monospace" font-size="12" fill="white" fill-opacity="0.06">
    <text x="380" y="50">01101</text>
    <text x="650" y="130">10010</text>
    <text x="420" y="170">11001</text>
    <text x="700" y="45">01110</text>
  </g>
  <!-- Monitor screen -->
  <g transform="translate(700, 150)" fill="none" stroke="white" stroke-opacity="0.1" stroke-width="1.5">
    <rect x="-25" y="-20" width="50" height="32" rx="3"/>
    <rect x="-8" y="12" width="16" height="8"/>
    <rect x="-15" y="20" width="30" height="3" rx="1.5"/>
    <line x1="-15" y1="-10" x2="15" y2="-10" stroke-opacity="0.06"/>
    <line x1="-15" y1="-3" x2="10" y2="-3" stroke-opacity="0.06"/>
    <line x1="-15" y1="4" x2="5" y2="4" stroke-opacity="0.06"/>
  </g>
  <!-- Chip/processor -->
  <g transform="translate(420, 120)" fill="none" stroke="white" stroke-opacity="0.08" stroke-width="1">
    <rect x="-15" y="-15" width="30" height="30" rx="3"/>
    <rect x="-8" y="-8" width="16" height="16" rx="1" stroke-opacity="0.06"/>
    <!-- Pins -->
    <line x1="-8" y1="-15" x2="-8" y2="-20"/><line x1="0" y1="-15" x2="0" y2="-20"/>
    <line x1="8" y1="-15" x2="8" y2="-20"/><line x1="-8" y1="15" x2="-8" y2="20"/>
    <line x1="0" y1="15" x2="0" y2="20"/><line x1="8" y1="15" x2="8" y2="20"/>
    <line x1="-15" y1="-8" x2="-20" y2="-8"/><line x1="-15" y1="0" x2="-20" y2="0"/>
    <line x1="-15" y1="8" x2="-20" y2="8"/><line x1="15" y1="-8" x2="20" y2="-8"/>
    <line x1="15" y1="0" x2="20" y2="0"/><line x1="15" y1="8" x2="20" y2="8"/>
  </g>
  <!-- WiFi arcs -->
  <g transform="translate(760, 40)" fill="none" stroke="white" stroke-opacity="0.08" stroke-width="1.5">
    <path d="M-15,-8 C-10,-15 10,-15 15,-8"/>
    <path d="M-10,-3 C-6,-8 6,-8 10,-3"/>
    <path d="M-5,2 C-3,-2 3,-2 5,2"/>
    <circle cx="0" cy="5" r="2" fill="white" fill-opacity="0.08"/>
  </g>
</svg>
