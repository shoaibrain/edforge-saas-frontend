<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="800" height="200">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a5f"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
  </defs>
  <rect width="800" height="200" fill="url(#bg)"/>
  <!-- Grid lines -->
  <g stroke="white" stroke-opacity="0.06" stroke-width="1">
    <line x1="300" y1="0" x2="300" y2="200"/><line x1="400" y1="0" x2="400" y2="200"/>
    <line x1="500" y1="0" x2="500" y2="200"/><line x1="600" y1="0" x2="600" y2="200"/>
    <line x1="700" y1="0" x2="700" y2="200"/>
    <line x1="300" y1="40" x2="800" y2="40"/><line x1="300" y1="80" x2="800" y2="80"/>
    <line x1="300" y1="120" x2="800" y2="120"/><line x1="300" y1="160" x2="800" y2="160"/>
  </g>
  <!-- Coordinate axes -->
  <g stroke="white" stroke-opacity="0.15" stroke-width="2">
    <line x1="500" y1="20" x2="500" y2="180"/>
    <line x1="380" y1="100" x2="620" y2="100"/>
    <polygon points="500,20 496,30 504,30" fill="white" fill-opacity="0.15" stroke="none"/>
    <polygon points="620,100 610,96 610,104" fill="white" fill-opacity="0.15" stroke="none"/>
  </g>
  <!-- Sine wave -->
  <path d="M380,100 C410,60 440,60 470,100 C500,140 530,140 560,100 C590,60 620,60 650,100" fill="none" stroke="white" stroke-opacity="0.12" stroke-width="2"/>
  <!-- Pi symbol -->
  <text x="680" y="60" font-family="serif" font-size="42" fill="white" fill-opacity="0.12" font-style="italic">π</text>
  <!-- Triangle -->
  <polygon points="350,150 390,80 430,150" fill="none" stroke="white" stroke-opacity="0.1" stroke-width="1.5"/>
  <!-- Circle -->
  <circle cx="680" cy="140" r="30" fill="none" stroke="white" stroke-opacity="0.1" stroke-width="1.5"/>
  <!-- Equals sign -->
  <g fill="white" fill-opacity="0.1">
    <rect x="730" y="85" width="30" height="4" rx="2"/>
    <rect x="730" y="95" width="30" height="4" rx="2"/>
  </g>
  <!-- Protractor arc -->
  <path d="M280,180 A80,80 0 0,1 360,180" fill="none" stroke="white" stroke-opacity="0.08" stroke-width="1.5"/>
  <!-- Square root symbol -->
  <path d="M600,45 L610,70 L620,30 L650,30" fill="none" stroke="white" stroke-opacity="0.1" stroke-width="1.5"/>
  <!-- Small scattered shapes -->
  <rect x="450" y="30" width="12" height="12" fill="none" stroke="white" stroke-opacity="0.08" stroke-width="1" transform="rotate(45 456 36)"/>
  <circle cx="340" cy="50" r="5" fill="white" fill-opacity="0.06"/>
  <text x="720" y="170" font-family="monospace" font-size="14" fill="white" fill-opacity="0.08">x²</text>
</svg>
