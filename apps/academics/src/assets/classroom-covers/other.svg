<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="800" height="200">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
  </defs>
  <rect width="800" height="200" fill="url(#bg)"/>
  <!-- Abstract hexagons -->
  <g fill="none" stroke="white" stroke-opacity="0.08" stroke-width="1.5">
    <polygon points="500,50 520,40 540,50 540,70 520,80 500,70" />
    <polygon points="540,50 560,40 580,50 580,70 560,80 540,70" />
    <polygon points="520,80 540,70 560,80 560,100 540,110 520,100" />
    <polygon points="460,70 480,60 500,70 500,90 480,100 460,90" />
  </g>
  <!-- Circles -->
  <circle cx="650" cy="60" r="25" fill="none" stroke="white" stroke-opacity="0.08" stroke-width="1.5"/>
  <circle cx="670" cy="75" r="18" fill="none" stroke="white" stroke-opacity="0.06" stroke-width="1"/>
  <circle cx="640" cy="80" r="12" fill="white" fill-opacity="0.04"/>
  <!-- Dots pattern -->
  <g fill="white" fill-opacity="0.05">
    <circle cx="380" cy="40" r="2"/><circle cx="400" cy="40" r="2"/><circle cx="420" cy="40" r="2"/>
    <circle cx="380" cy="55" r="2"/><circle cx="400" cy="55" r="2"/><circle cx="420" cy="55" r="2"/>
    <circle cx="380" cy="70" r="2"/><circle cx="400" cy="70" r="2"/><circle cx="420" cy="70" r="2"/>
  </g>
  <!-- School building silhouette -->
  <g transform="translate(700, 130)" fill="white" fill-opacity="0.08" stroke="none">
    <rect x="-30" y="-25" width="60" height="35" rx="2"/>
    <rect x="-15" y="-35" width="30" height="12" rx="2"/>
    <polygon points="-5,-35 0,-42 5,-35"/>
    <!-- Windows -->
    <rect x="-22" y="-18" width="8" height="8" rx="1" fill-opacity="0.04"/>
    <rect x="-8" y="-18" width="8" height="8" rx="1" fill-opacity="0.04"/>
    <rect x="6" y="-18" width="8" height="8" rx="1" fill-opacity="0.04"/>
    <rect x="-22" y="-4" width="8" height="8" rx="1" fill-opacity="0.04"/>
    <rect x="-8" y="-4" width="8" height="8" rx="1" fill-opacity="0.04"/>
    <rect x="6" y="-4" width="8" height="8" rx="1" fill-opacity="0.04"/>
    <!-- Door -->
    <rect x="-5" y="0" width="10" height="10" rx="1" fill-opacity="0.06"/>
  </g>
  <!-- Graduation cap -->
  <g transform="translate(440, 130)" fill="white" fill-opacity="0.07" stroke="none">
    <polygon points="0,-12 25,0 0,12 -25,0"/>
    <polygon points="0,12 -18,5 -18,15 0,22 18,15 18,5"/>
    <line x1="22" y1="2" x2="22" y2="18" stroke="white" stroke-opacity="0.06" stroke-width="1.5"/>
    <circle cx="22" cy="20" r="3" fill-opacity="0.05"/>
  </g>
  <!-- Star -->
  <g transform="translate(600, 140)" fill="white" fill-opacity="0.06" stroke="none">
    <polygon points="0,-16 4,-5 16,-5 7,3 10,14 0,8 -10,14 -7,3 -16,-5 -4,-5"/>
  </g>
  <!-- Abstract lines -->
  <line x1="350" y1="100" x2="380" y2="100" stroke="white" stroke-opacity="0.06" stroke-width="2" stroke-linecap="round"/>
  <line x1="350" y1="108" x2="370" y2="108" stroke="white" stroke-opacity="0.04" stroke-width="2" stroke-linecap="round"/>
  <!-- Scattered accents -->
  <circle cx="760" cy="40" r="3" fill="white" fill-opacity="0.05"/>
  <circle cx="350" cy="170" r="2" fill="white" fill-opacity="0.04"/>
</svg>
