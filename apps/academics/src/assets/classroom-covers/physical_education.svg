<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="800" height="200">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c2d12"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
  </defs>
  <rect width="800" height="200" fill="url(#bg)"/>
  <!-- Track lanes -->
  <g stroke="white" stroke-opacity="0.06" stroke-width="1" fill="none">
    <path d="M300,180 L550,180 A50,50 0 0,0 550,80 L300,80"/>
    <path d="M300,170 L550,170 A40,40 0 0,0 550,90 L300,90"/>
    <path d="M300,160 L550,160 A30,30 0 0,0 550,100 L300,100"/>
  </g>
  <!-- Running figure -->
  <g transform="translate(480, 90)" stroke="white" stroke-opacity="0.15" stroke-width="2" fill="none" stroke-linecap="round">
    <circle cx="0" cy="-20" r="8" fill="white" fill-opacity="0.1"/>
    <line x1="0" y1="-12" x2="-3" y2="10"/>
    <line x1="-3" y1="10" x2="-15" y2="30"/>
    <line x1="-3" y1="10" x2="10" y2="28"/>
    <line x1="0" y1="-5" x2="-18" y2="5"/>
    <line x1="0" y1="-5" x2="15" y2="-15"/>
  </g>
  <!-- Basketball -->
  <g transform="translate(640, 60)" fill="none" stroke="white" stroke-opacity="0.1" stroke-width="1.5">
    <circle r="20"/>
    <path d="M-20,0 C-10,-8 10,-8 20,0"/>
    <path d="M-20,0 C-10,8 10,8 20,0"/>
    <line x1="0" y1="-20" x2="0" y2="20"/>
  </g>
  <!-- Soccer ball -->
  <g transform="translate(710, 130)" fill="none" stroke="white" stroke-opacity="0.08" stroke-width="1">
    <circle r="16"/>
    <polygon points="0,-8 7.6,-2.5 4.7,6.5 -4.7,6.5 -7.6,-2.5" fill="white" fill-opacity="0.05"/>
  </g>
  <!-- Whistle -->
  <g transform="translate(400, 55)" fill="white" fill-opacity="0.08" stroke="none">
    <rect x="0" y="-5" width="25" height="10" rx="3"/>
    <circle cx="28" cy="0" r="8"/>
    <circle cx="28" cy="0" r="3" fill-opacity="0.04"/>
  </g>
  <!-- Stopwatch -->
  <g transform="translate(740, 55)" fill="none" stroke="white" stroke-opacity="0.1" stroke-width="1.5">
    <circle r="15"/>
    <line x1="0" y1="-15" x2="0" y2="-20"/>
    <rect x="-3" y="-22" width="6" height="4" rx="1" fill="white" fill-opacity="0.08"/>
    <line x1="0" y1="0" x2="0" y2="-10"/>
    <line x1="0" y1="0" x2="7" y2="3"/>
  </g>
  <!-- Sneaker outline -->
  <g transform="translate(580, 155)" fill="white" fill-opacity="0.07" stroke="none">
    <path d="M-20,5 L-20,-5 C-15,-15 0,-15 10,-12 L25,-12 L30,-5 L30,5 Z"/>
    <line x1="-10" y1="-8" x2="-5" y2="-3" stroke="white" stroke-opacity="0.04" stroke-width="1"/>
    <line x1="-3" y1="-10" x2="2" y2="-5" stroke="white" stroke-opacity="0.04" stroke-width="1"/>
  </g>
  <!-- Scattered dots -->
  <circle cx="350" cy="50" r="3" fill="white" fill-opacity="0.05"/>
  <circle cx="670" cy="170" r="2" fill="white" fill-opacity="0.04"/>
</svg>
