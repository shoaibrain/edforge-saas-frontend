version: '3.8'

services:
  # Shell Host Application
  shell:
    build:
      context: ..
      dockerfile: docker/Dockerfile.dev
      args:
        APP_NAME: shell
        APP_PORT: 3000
    ports:
      - "3000:3000"
    volumes:
      - ../apps/shell/src:/app/apps/shell/src
      - ../packages:/app/packages
      - /app/node_modules
    environment:
      # [MVP-PARKED] - VITE_EDFI_URL=http://edfi:3001
      - VITE_ACADEMICS_URL=http://academics:3002
      - VITE_FINANCE_URL=http://finance:3003
      - VITE_PEOPLE_URL=http://people:3006
    depends_on:
      # [MVP-PARKED] - edfi
      - academics
      - finance
      - people
    networks:
      - edforge-network

  # [MVP-PARKED] Ed-Fi Module
  # edfi:
  #   build:
  #     context: ..
  #     dockerfile: docker/Dockerfile.dev
  #     args:
  #       APP_NAME: edfi
  #       APP_PORT: 3001
  #   ports:
  #     - "3001:3001"
  #   volumes:
  #     - ../apps/edfi/src:/app/apps/edfi/src
  #     - ../packages:/app/packages
  #     - /app/node_modules
  #   networks:
  #     - edforge-network
  # [/MVP-PARKED]

  # Academics Module
  academics:
    build:
      context: ..
      dockerfile: docker/Dockerfile.dev
      args:
        APP_NAME: academics
        APP_PORT: 3002
    ports:
      - "3002:3002"
    volumes:
      - ../apps/academics/src:/app/apps/academics/src
      - ../packages:/app/packages
      - /app/node_modules
    networks:
      - edforge-network

  # Finance Module
  finance:
    build:
      context: ..
      dockerfile: docker/Dockerfile.dev
      args:
        APP_NAME: finance
        APP_PORT: 3003
    ports:
      - "3003:3003"
    volumes:
      - ../apps/finance/src:/app/apps/finance/src
      - ../packages:/app/packages
      - /app/node_modules
    networks:
      - edforge-network

  # People Module
  people:
    build:
      context: ..
      dockerfile: docker/Dockerfile.dev
      args:
        APP_NAME: people
        APP_PORT: 3006
    ports:
      - "3006:3006"
    volumes:
      - ../apps/people/src:/app/apps/people/src
      - ../packages:/app/packages
      - /app/node_modules
    networks:
      - edforge-network

  # Nginx Reverse Proxy (for production-like routing in dev)
  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - shell
      # [MVP-PARKED] - edfi
      - academics
      - finance
      - people
    networks:
      - edforge-network

networks:
  edforge-network:
    driver: bridge
