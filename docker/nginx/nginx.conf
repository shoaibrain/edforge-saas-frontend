# EdForge MFE Development Nginx Configuration
# Routes requests to appropriate micro-frontend services

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Logging
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    sendfile on;
    keepalive_timeout 65;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    # Upstream services
    upstream shell {
        server shell:3000;
    }

    # [MVP-PARKED] Ed-Fi upstream
    # upstream edfi {
    #     server edfi:3001;
    # }
    # [/MVP-PARKED]

    upstream academics {
        server academics:3002;
    }

    upstream finance {
        server finance:3003;
    }

    upstream people {
        server people:3006;
    }

    server {
        listen 80;
        server_name localhost;

        # CORS headers for development
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type, Authorization" always;

        # Handle OPTIONS preflight requests
        if ($request_method = OPTIONS) {
            return 204;
        }

        # Shell application (main entry point)
        location / {
            proxy_pass http://shell;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 86400;
        }

        # [MVP-PARKED] Ed-Fi Module Remote Entry
        # location /remotes/edfi/ {
        #     proxy_pass http://edfi/;
        #     proxy_http_version 1.1;
        #     proxy_set_header Host $host;
        #     proxy_set_header X-Real-IP $remote_addr;
        # }
        # [/MVP-PARKED]

        # Academics Module Remote Entry
        location /remotes/academics/ {
            proxy_pass http://academics/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Finance Module Remote Entry
        location /remotes/finance/ {
            proxy_pass http://finance/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # People Module Remote Entry
        location /remotes/people/ {
            proxy_pass http://people/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Health check endpoint
        location /health {
            return 200 "OK\n";
            add_header Content-Type text/plain;
        }
    }

    # Tenant subdomain routing (optional)
    # Uncomment for production-like multi-tenant routing
    # server {
    #     listen 80;
    #     server_name ~^(?<tenant>.+)\.localhost$;
    #
    #     location / {
    #         proxy_pass http://shell;
    #         proxy_set_header X-Tenant-ID $tenant;
    #         proxy_set_header Host $host;
    #     }
    # }
}
